services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: panendesa-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Runtime environment variables (secrets)
      # These are loaded from .env file, NOT baked into image
      - PORT=${BACKEND_PORT:-3001}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY}
    ports:
      - "${BACKEND_PORT:-3011}:3001"
    networks:
      - panendesa-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build arguments for NEXT_PUBLIC_* variables
        # These MUST be baked at build time because Next.js inlines them to client bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: panendesa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Runtime environment variables (if any)
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-3010}:3000"
    networks:
      - panendesa-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  panendesa-network:
    driver: bridge
